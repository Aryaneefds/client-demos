<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aria Lounge Chair - 3D Configurator</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#0e1418;color:#f2f2f2;overflow:hidden}
  #scene{position:fixed;inset:0}
  #panel{position:fixed;right:16px;top:16px;width:300px;max-height:calc(100vh - 32px);overflow:auto;
    background:rgba(14,16,20,.86);backdrop-filter:blur(12px);border:1px solid #2c2c34;border-radius:16px;padding:18px}
  #panel h1{font-size:20px;margin:0 0 2px}
  #panel .sub{color:#a8a8b3;font-size:12px;margin-bottom:10px}
  #price{font-size:26px;font-weight:700;margin:6px 0 12px}
  #price small{font-size:12px;color:#a8a8b3;font-weight:400}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#a8a8b3;margin:12px 0 6px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline:2px solid #3a3a44}
  .sw.on{border-color:#fff}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:7px 12px;border-radius:99px;border:1px solid #3a3a44;background:transparent;color:#eee;font-size:13px;cursor:pointer}
  .pill.on{background:#eee;color:#111;border-color:#eee}
  #cta{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:#ff5a1f;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  #cta:active{transform:scale(.98)}
  #note{font-size:11px;color:#8a8a95;margin-top:8px;min-height:14px}
  #hint{position:fixed;left:16px;bottom:14px;font-size:12px;color:#e8e8ee;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:99px}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 75% at 42% 42%, transparent 58%, rgba(0,0,0,.42) 100%);}
  @media (max-width:640px){
    #panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:44vh}
    #hint{display:none}
  }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="scene"></div>
<div id="vignette"></div>
<div id="panel">
  <h1>Aria Lounge Chair</h1>
  <div class="sub">Solid oak frame · premium fabric · free US/EU shipping</div>
  <div id="price">$249 <small id="tier">Everyday fabric</small></div>
  <div class="lbl">Fabric</div><div class="swatches" id="fabrics"></div>
  <div class="lbl">Leg finish</div><div class="pills" id="legs"></div>
  <div class="lbl">View</div><div class="pills"><button class="pill on" id="spin">Auto-rotate on</button></div>
  <button id="cta">Add to cart - <span id="ctaprice">$249</span></button>
  <div id="note"></div>
</div>
<div id="hint">Drag to rotate · Scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {Sky} from 'three/addons/objects/Sky.js';
import {Water} from 'three/addons/objects/Water.js';

const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .42;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc7d5e0, 35, 160);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 2000);
camera.position.set(2.6, 1.9, 3.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .75, 0);
controls.enableDamping = true;
controls.minDistance = 1.6; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI/2 - .02;

// ---- sky + sun (one rig drives light, sky shader, and reflections) ----
function makeSky(){
  const s = new Sky(); s.scale.setScalar(2000);
  const u = s.material.uniforms;
  u.turbidity.value = 6; u.rayleigh.value = 2.8;
  u.mieCoefficient.value = .004; u.mieDirectionalG.value = .85;
  return s;
}
const sky = makeSky(); scene.add(sky);
const sun = new THREE.Vector3().setFromSphericalCoords(1,
  THREE.MathUtils.degToRad(90 - 26), THREE.MathUtils.degToRad(38));
sky.material.uniforms.sunPosition.value.copy(sun);
{ // reflections sampled from the same sky, so chrome and leather match the outdoors
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene(); const esky = makeSky();
  esky.material.uniforms.sunPosition.value.copy(sun); es.add(esky);
  scene.environment = pm.fromScene(es, .04).texture; pm.dispose();
}

const key = new THREE.DirectionalLight(0xfff1dd, 2.6);
key.position.copy(sun).multiplyScalar(30);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.radius = 7; key.shadow.blurSamples = 14;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xbfd6ee, 0x8a7a5f, .55));

// ---- worlds: beach / mountains / studio ----
const worlds = new THREE.Group(); scene.add(worlds);
let worldNodes = [];
function clearWorld(){ worldNodes.forEach(n => { worlds.remove(n); }); worldNodes = []; }
function sandTextures(){
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  g.fillStyle = '#cfa96f'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++){
    const x = Math.random()*s, y = Math.random()*s, r = Math.random()*1.3+.3;
    g.fillStyle = Math.random()<.5 ? 'rgba(120,85,45,0.25)' : 'rgba(255,240,210,0.22)';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 40; i++){
    const x = Math.random()*s, y = Math.random()*s, r = 8+Math.random()*22;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(150,110,60,0.10)'); gr.addColorStop(1, 'rgba(150,110,60,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const map = new THREE.CanvasTexture(cv);
  map.wrapS = map.wrapT = THREE.RepeatWrapping; map.repeat.set(10, 10);
  map.colorSpace = THREE.SRGBColorSpace;
  const bump = new THREE.CanvasTexture(cv);
  bump.wrapS = bump.wrapT = THREE.RepeatWrapping; bump.repeat.set(10, 10);
  return {map, bump};
}
const sandTex = sandTextures();
function sandDisc(r){
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 72),
    new THREE.MeshStandardMaterial({map: sandTex.map, bumpMap: sandTex.bump, bumpScale:.4, roughness:1}));
  m.rotation.x = -Math.PI/2; m.receiveShadow = true; return m;
}
function ridge(count, rMin, rMax, hMin, hMax, color){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color, roughness:1, flatShading:true});
  for (let i = 0; i < count; i++){
    const a = (i / count) * Math.PI * 2 + Math.random() * .4;
    const r = rMin + Math.random() * (rMax - rMin);
    const h = hMin + Math.random() * (hMax - hMin);
    const w = h * (2.0 + Math.random() * 1.2); // wide flat slopes, only tops clear the haze
    const m = new THREE.Mesh(new THREE.ConeGeometry(w, h, 5), mat);
    m.position.set(Math.cos(a) * r, h / 2 - 4, Math.sin(a) * r);
    m.rotation.y = Math.random() * 3; g.add(m);
  }
  return g;
}
let water = null;
function setWorld(){
  clearWorld();
  const add = n => { worlds.add(n); worldNodes.push(n); };
  scene.fog.color.set(0xc7d5e0); scene.fog.near = 35; scene.fog.far = 220;
  water = new Water(new THREE.PlaneGeometry(1200, 1200), {
    textureWidth: 512, textureHeight: 512,
    waterNormals: new THREE.TextureLoader().load('textures/waternormals.jpg',
      t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; }),
    sunDirection: sun.clone().normalize(), sunColor: 0xfff2dd,
    waterColor: 0x0a3b46, distortionScale: 2.6, fog: true
  });
  water.rotation.x = -Math.PI/2; water.position.y = -.4; add(water);
  add(sandDisc(26));
  const wet = new THREE.Mesh(new THREE.RingGeometry(19, 26, 72),
    new THREE.MeshStandardMaterial({color:0xa87f4e, roughness:.35}));
  wet.rotation.x = -Math.PI/2; wet.position.y = .01; wet.receiveShadow = true; add(wet);
  add(ridge(6, 170, 260, 8, 20, 0x7d94a3)); // low far headlands, mostly haze
  // deck ring the chair sits in, present in every world
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.55, 1.62, 72),
    new THREE.MeshBasicMaterial({color:0xff5a1f, transparent:true, opacity:.6, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.position.y = .01; add(ring);
}
setWorld();

// ---- chair ----
const chair = new THREE.Group(); scene.add(chair);
const fabric = new THREE.MeshStandardMaterial({color:0x9a5a3c, roughness:.85});
const cushionM = new THREE.MeshStandardMaterial({color:0xb07a52, roughness:.9});
const legM = new THREE.MeshStandardMaterial({color:0x8a5a2e, roughness:.45, metalness:.05});
function part(geo, mat, x, y, z, rx=0, ry=0, rz=0){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true; chair.add(m); return m;
}
part(new RoundedBoxGeometry(1.25, .16, 1.1, 4, .06), fabric, 0, .78, 0);
part(new RoundedBoxGeometry(1.1, .14, .95, 4, .07), cushionM, 0, .92, .02);
part(new RoundedBoxGeometry(1.1, .78, .16, 4, .07), cushionM, 0, 1.42, -.5, -.1);
part(new RoundedBoxGeometry(1.22, .86, .1, 4, .04), fabric, 0, 1.42, -.6, -.1);
const legGeo = new THREE.CylinderGeometry(.045, .035, .78, 20);
[[ -.52,-.46],[.52,-.46],[-.52,.46],[.52,.46]].forEach(([x,z],i) => {
  const l = part(legGeo, legM, x, .39, z);
  l.rotation.z = (i%2 ? -1:1)*.06; l.rotation.x = (i<2 ? 1:-1)*.06;
});

// ---- options ----
const FABRICS = [
  {n:'Terracotta', c:0x9a5a3c, cu:0xb07a52, p:249, t:'Everyday fabric'},
  {n:'Forest',     c:0x2f5d3a, cu:0x3f7350, p:249, t:'Everyday fabric'},
  {n:'Midnight',   c:0x2a3a5f, cu:0x3a4f78, p:269, t:'Performance weave'},
  {n:'Oat',        c:0xc9bfae, cu:0xd8cfbf, p:269, t:'Performance weave'},
  {n:'Charcoal',   c:0x2b2b30, cu:0x3a3a42, p:299, t:'Italian leather'},
  {n:'Cognac',     c:0x8a4a1f, cu:0xa05c28, p:299, t:'Italian leather'},
];
const LEGS = [
  {n:'Natural oak', c:0x8a5a2e, rough:.45, metal:0},
  {n:'Walnut',      c:0x4a2c14, rough:.4,  metal:0},
  {n:'Black steel', c:0x1a1a1c, rough:.3,  metal:.85},
];
const priceEl = document.getElementById('price');
const tierEl = document.getElementById('tier');
const ctaPrice = document.getElementById('ctaprice');
const note = document.getElementById('note');
function setPrice(p, t){
  priceEl.childNodes[0].textContent = '$'+p+' ';
  tierEl.textContent = t; ctaPrice.textContent = '$'+p;
}
const fWrap = document.getElementById('fabrics');
FABRICS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i===0 ? ' on' : ''); b.title = `${f.n} - $${f.p}`;
  b.style.background = '#'+f.c.toString(16).padStart(6,'0');
  b.onclick = () => {
    fWrap.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    fabric.color.set(f.c); cushionM.color.set(f.cu);
    fabric.roughness = f.p>280 ? .55 : .85;
    setPrice(f.p, f.t); note.textContent = `${f.n} · ${f.t}`;
  };
  fWrap.appendChild(b);
});
const lWrap = document.getElementById('legs');
LEGS.forEach((l, i) => {
  const b = document.createElement('button');
  b.className = 'pill' + (i===0 ? ' on' : ''); b.textContent = l.n;
  b.onclick = () => {
    lWrap.querySelectorAll('.pill').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    legM.color.set(l.c); legM.roughness = l.rough; legM.metalness = l.metal;
    note.textContent = `Legs: ${l.n}`;
  };
  lWrap.appendChild(b);
});
let spin = true;
const spinB = document.getElementById('spin');
spinB.onclick = () => { spin = !spin; spinB.textContent = spin ? 'Auto-rotate on' : 'Auto-rotate off'; spinB.classList.toggle('on', spin); };
let cart = 0;
document.getElementById('cta').onclick = () => {
  cart++; note.textContent = `Added to cart (${cart}) - demo checkout, wire to Shopify in production.`;
};

const clock = new THREE.Clock();
(function loop(){ requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  if (water) water.material.uniforms.time.value += dt * .8;
  if (spin) chair.rotation.y += .007;
  controls.update(); renderer.render(scene, camera);
})();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script></body></html>
