<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Demo 1 — 3D Product Configurator (Furniture D2C)</title>
<style>body{margin:0;font-family:system-ui;background:#111;color:#eee;display:flex;height:100vh} #c{flex:1} #ui{width:300px;padding:20px;background:#181818;border-left:1px solid #333} button{margin:4px;padding:8px 12px;cursor:pointer} .sw{width:28px;height:28px;display:inline-block;margin:4px;border:2px solid #fff;cursor:pointer}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="c"></div>
<div id="ui"><h2>UrbanSit Chair</h2><p>₹<span id="price">8999</span> · drag to rotate · scroll to zoom</p>
<h4>Color</h4><div id="cols"></div>
<h4>Fabric</h4><button data-f="6000">Standard ₹6k</button><button data-f="8999">Premium ₹8,999</button><button data-f="12999">Leather ₹12,999</button>
<h4>View</h4><button id="spin">Auto-rotate: ON</button><br/><br/><button id="cta" style="background:#ff5a1f;color:#fff;border:0;font-size:16px">Add to Cart</button>
<p style="color:#888;font-size:12px">Demo 1 of 3 — pitch: "your catalogue in 3D, fewer returns, more AOV".</p></div>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const el=document.getElementById('c');
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth-300,innerHeight); r.shadowMap.enabled=true; el.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color(0x111111);
const cam=new THREE.PerspectiveCamera(45,(innerWidth-300)/innerHeight,.1,100); cam.position.set(3,2.2,4);
const c=new OrbitControls(cam,r.domElement); c.target.set(0,.8,0);
s.add(new THREE.HemisphereLight(0xffffff,0x222222,1.1));
const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(4,6,4); key.castShadow=true; s.add(key);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x222222,roughness:.9})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; s.add(floor);
// chair: seat + back + 4 legs (procedural, no assets)
const mat=new THREE.MeshStandardMaterial({color:0xc2410c,roughness:.5});
const g=new THREE.Group();
const seat=new THREE.Mesh(new THREE.BoxGeometry(1.2,.12,1.1),mat); seat.position.y=.8; seat.castShadow=true; g.add(seat);
const back=new THREE.Mesh(new THREE.BoxGeometry(1.2,.9,.1),mat); back.position.set(0,1.3,-.5); back.castShadow=true; g.add(back);
const legG=new THREE.CylinderGeometry(.05,.05,.8,16); const legM=new THREE.MeshStandardMaterial({color:0x222222,metalness:.7,roughness:.3});
[[-.5,-.45],[.5,-.45],[-.5,.45],[.5,.45]].forEach(([x,z])=>{const l=new THREE.Mesh(legG,legM);l.position.set(x,.4,z);l.castShadow=true;g.add(l);});
s.add(g);
const colors=[0xc2410c,0x1d4ed8,0x15803d,0xeab308,0x111111,0xf5f5f4];
const cols=document.getElementById('cols');
colors.forEach(col=>{const d=document.createElement('div');d.className='sw';d.style.background='#'+col.toString(16).padStart(6,'0');d.onclick=()=>mat.color.set(col);cols.appendChild(d);});
const price=document.getElementById('price');
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{price.textContent=b.dataset.f; mat.roughness=b.dataset.f>10000?.25:.6;});
let spin=true; document.getElementById('spin').onclick=e=>{spin=!spin;e.target.textContent='Auto-rotate: '+(spin?'ON':'OFF');};
document.getElementById('cta').onclick=()=>alert('Demo checkout — wire to Shopify/WooCommerce in paid build.');
(function loop(){requestAnimationFrame(loop); if(spin) g.rotation.y+=.008; c.update(); r.render(s,cam);})();
addEventListener('resize',()=>{r.setSize(innerWidth-300,innerHeight);cam.aspect=(innerWidth-300)/innerHeight;cam.updateProjectionMatrix();});
</script></body></html>
