<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aria Lounge Chair - 3D Configurator</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#101014;color:#f2f2f2;overflow:hidden}
  #scene{position:fixed;inset:0}
  #panel{position:fixed;right:16px;top:16px;width:300px;max-height:calc(100vh - 32px);overflow:auto;
    background:rgba(18,18,22,.86);backdrop-filter:blur(12px);border:1px solid #2c2c34;border-radius:16px;padding:18px}
  #panel h1{font-size:20px;margin:0 0 2px}
  #panel .sub{color:#a8a8b3;font-size:12px;margin-bottom:10px}
  #price{font-size:26px;font-weight:700;margin:6px 0 12px}
  #price small{font-size:12px;color:#a8a8b3;font-weight:400}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#a8a8b3;margin:12px 0 6px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline:2px solid #3a3a44}
  .sw.on{border-color:#fff}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:7px 12px;border-radius:99px;border:1px solid #3a3a44;background:transparent;color:#eee;font-size:13px;cursor:pointer}
  .pill.on{background:#eee;color:#111;border-color:#eee}
  #cta{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:#ff5a1f;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  #cta:active{transform:scale(.98)}
  #note{font-size:11px;color:#8a8a95;margin-top:8px;min-height:14px}
  #hint{position:fixed;left:16px;bottom:14px;font-size:12px;color:#8a8a95;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:99px}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 75% at 42% 42%, transparent 55%, rgba(0,0,0,.55) 100%);}
  @media (max-width:640px){
    #panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:44vh}
    #hint{display:none}
  }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="scene"></div>
<div id="vignette"></div>
<div id="panel">
  <h1>Aria Lounge Chair</h1>
  <div class="sub">Solid oak frame · premium fabric · free US/EU shipping</div>
  <div id="price">$249 <small id="tier">Everyday fabric</small></div>
  <div class="lbl">Fabric</div><div class="swatches" id="fabrics"></div>
  <div class="lbl">Leg finish</div><div class="pills" id="legs"></div>
  <div class="lbl">View</div><div class="pills"><button class="pill on" id="spin">Auto-rotate on</button></div>
  <button id="cta">Add to cart - <span id="ctaprice">$249</span></button>
  <div id="note"></div>
</div>
<div id="hint">Drag to rotate · Scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101014);
scene.fog = new THREE.Fog(0x101014, 9, 20); // infinite sweep: floor melts into bg
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 100);
camera.position.set(2.6, 1.9, 3.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .75, 0);
controls.enableDamping = true;
controls.minDistance = 1.6; controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI/2 - .02;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3.5, 6, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x1a1512, .5));

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(11, 64),
  new THREE.MeshStandardMaterial({color:0x1b1b20, roughness:.95}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const ring = new THREE.Mesh(
  new THREE.RingGeometry(1.55, 1.62, 64),
  new THREE.MeshBasicMaterial({color:0xff5a1f, transparent:true, opacity:.55, side:THREE.DoubleSide}));
ring.rotation.x = -Math.PI/2; ring.position.y = .005; scene.add(ring);

// ---- chair ----
const chair = new THREE.Group(); scene.add(chair);
const fabric = new THREE.MeshStandardMaterial({color:0x9a5a3c, roughness:.85});
const cushionM = new THREE.MeshStandardMaterial({color:0xb07a52, roughness:.9});
const legM = new THREE.MeshStandardMaterial({color:0x8a5a2e, roughness:.45, metalness:.05});
function part(geo, mat, x, y, z, rx=0, ry=0, rz=0){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true; chair.add(m); return m;
}
part(new RoundedBoxGeometry(1.25, .16, 1.1, 4, .06), fabric, 0, .78, 0);                 // seat base
const cushion = part(new RoundedBoxGeometry(1.1, .14, .95, 4, .07), cushionM, 0, .92, .02); // seat cushion
const backC = part(new RoundedBoxGeometry(1.1, .78, .16, 4, .07), cushionM, 0, 1.42, -.5, -.1); // back cushion
part(new RoundedBoxGeometry(1.22, .86, .1, 4, .04), fabric, 0, 1.42, -.6, -.1);            // back shell
const legGeo = new THREE.CylinderGeometry(.045, .035, .78, 20);
const legPos = [[-.52,-.46],[.52,-.46],[-.52,.46],[.52,.46]];
const legMeshes = legPos.map(([x,z]) => part(legGeo, legM, x, .39, z));
legMeshes.forEach((l,i)=>{ l.rotation.z = (i%2? -1:1)*.06; l.rotation.x = (i<2? 1:-1)*.06; });

// ---- options ----
const FABRICS = [
  {n:'Terracotta', c:0x9a5a3c, cu:0xb07a52, p:249, t:'Everyday fabric'},
  {n:'Forest',     c:0x2f5d3a, cu:0x3f7350, p:249, t:'Everyday fabric'},
  {n:'Midnight',   c:0x2a3a5f, cu:0x3a4f78, p:269, t:'Performance weave'},
  {n:'Oat',        c:0xc9bfae, cu:0xd8cfbf, p:269, t:'Performance weave'},
  {n:'Charcoal',   c:0x2b2b30, cu:0x3a3a42, p:299, t:'Italian leather'},
  {n:'Cognac',     c:0x8a4a1f, cu:0xa05c28, p:299, t:'Italian leather'},
];
const LEGS = [
  {n:'Natural oak', c:0x8a5a2e, rough:.45, metal:0},
  {n:'Walnut',      c:0x4a2c14, rough:.4,  metal:0},
  {n:'Black steel', c:0x1a1a1c, rough:.3,  metal:.85},
];
const priceEl = document.getElementById('price');
const tierEl = document.getElementById('tier');
const ctaPrice = document.getElementById('ctaprice');
const note = document.getElementById('note');
let curP = 249;
function setPrice(p, t){ curP = p;
  priceEl.childNodes[0].textContent = '$'+p+' ';
  tierEl.textContent = t; ctaPrice.textContent = '$'+p;
}
const fWrap = document.getElementById('fabrics');
FABRICS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i===0 ? ' on' : ''); b.title = `${f.n} - $${f.p}`;
  b.style.background = '#'+f.c.toString(16).padStart(6,'0');
  b.onclick = () => {
    fWrap.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    fabric.color.set(f.c); cushionM.color.set(f.cu);
    fabric.roughness = f.p>280 ? .55 : .85;
    setPrice(f.p, f.t); note.textContent = `${f.n} · ${f.t}`;
  };
  fWrap.appendChild(b);
});
const lWrap = document.getElementById('legs');
LEGS.forEach((l, i) => {
  const b = document.createElement('button');
  b.className = 'pill' + (i===0 ? ' on' : ''); b.textContent = l.n;
  b.onclick = () => {
    lWrap.querySelectorAll('.pill').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    legM.color.set(l.c); legM.roughness = l.rough; legM.metalness = l.metal;
    note.textContent = `Legs: ${l.n}`;
  };
  lWrap.appendChild(b);
});
let spin = true;
const spinB = document.getElementById('spin');
spinB.onclick = () => { spin = !spin; spinB.textContent = spin ? 'Auto-rotate on' : 'Auto-rotate off'; spinB.classList.toggle('on', spin); };
let cart = 0;
document.getElementById('cta').onclick = () => {
  cart++; note.textContent = `Added to cart (${cart}) - demo checkout, wire to Shopify in production.`;
};

(function loop(){ requestAnimationFrame(loop);
  if (spin) chair.rotation.y += .007;
  controls.update(); renderer.render(scene, camera);
})();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script></body></html>
